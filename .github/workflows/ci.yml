name: CI

# Typecheck, unit tests and build run as three jobs at once; the browser suite starts once the build
# passes, split across eight runners one test at a time, and their reports are merged into one. A
# failed typecheck or unit test run cancels the rest of the run (OP-123). A pull request branch runs
# once, on the pull_request event: a push to it does not start a second run.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write # to cancel the run when a check fails

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Cancel the rest of the run
        if: failure()
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Cancel the rest of the run
        if: failure()
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  e2e:
    name: Browser suite ${{ matrix.shard }}/8
    needs: build
    runs-on: ubuntu-latest
    # A shard runs an eighth of the suite: 6 to 9 minutes on a hosted runner, about half again on a slow one.
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright
        name: Playwright's version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright's browser
        if: steps.browser.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install the browser's system packages
        if: steps.browser.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: End-to-end tests, shard ${{ matrix.shard }} of 8 (local transport on desktop and phone, and the room server)
        run: pnpm e2e --shard=${{ matrix.shard }}/8
        env:
          CI: 'true'
          PW_BLOB: 'true'
      - name: Upload this shard's report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: apps/park/blob-report
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output-${{ matrix.shard }}
          path: |
            apps/park/e2e-screenshots
            apps/park/test-results
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: Browser suite report
    if: always() && needs.e2e.result != 'skipped'
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: apps/park/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge the shards' reports into one
        working-directory: apps/park
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports
      - name: Upload the merged report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/park/playwright-report
          retention-days: 7
      - name: The suite's result
        if: needs.e2e.result != 'success'
        run: |
          echo "The browser suite did not pass (${{ needs.e2e.result }}): see the shards above and the merged report." >> "$GITHUB_STEP_SUMMARY"
          exit 1
