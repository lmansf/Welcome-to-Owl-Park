name: Uptime

# Every 15 minutes, ask the park's health check (docs/PLAYBOOK.md). Three failures in a row fail
# the run, and GitHub emails the owner about a failed run. The park's address is the repository
# variable PARK_URL (Settings → Secrets and variables → Actions → Variables); without it the run
# checks nothing and passes.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask /api/health
        env:
          PARK_URL: ${{ vars.PARK_URL }}
        run: |
          if [ -z "$PARK_URL" ]; then echo "PARK_URL is not set: nothing to check."; exit 0; fi
          for attempt in 1 2 3; do
            code=$(curl -s -o health.json -w '%{http_code}' --max-time 15 "${PARK_URL%/}/api/health" || true)
            if [ "$code" = "200" ]; then cat health.json; exit 0; fi
            echo "Try $attempt: $code $(cat health.json 2>/dev/null)"
            [ "$attempt" = 3 ] || sleep 20
          done
          echo "::error::The park's health check failed three times in a row (last answer $code)."
          exit 1
