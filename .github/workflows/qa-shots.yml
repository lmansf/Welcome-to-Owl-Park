name: QA shots (temporary)
on:
  push:
    branches: [qa-ends]
permissions:
  contents: read
jobs:
  shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/park
      - run: pnpm exec playwright test qashots --project=desktop --project=phone || true
        working-directory: apps/park
      - name: Print the pictures
        working-directory: apps/park
        run: |
          for f in qa-shots/*.png e2e-screenshots/*.png; do
            [ -f "$f" ] || continue
            echo "=====BEGIN $f"
            base64 -w 0 "$f"
            echo
            echo "=====END $f"
          done
