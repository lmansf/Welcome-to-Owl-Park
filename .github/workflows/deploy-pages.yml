# Publishes the park to GitHub Pages on every push to main, once switched on.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions", then the repository
# variable PAGES_DEPLOY=true (Settings -> Secrets and variables -> Actions -> Variables). Without the
# variable the workflow is skipped, so a repository that deploys to Cloudflare instead stays green.
# Optional repository variables (Settings -> Secrets and variables -> Actions -> Variables):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY  -> internet multiplayer via Supabase Realtime
#   VITE_SHOP_URL                              -> the gift shop link
# Without them the park still works, with multiplayer limited to tabs on one device.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ vars.PAGES_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SHOP_URL: ${{ vars.VITE_SHOP_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/park/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
