<svg xmlns="http://www.w3.org/2000/svg" width="200" height="240" viewBox="0 0 200 240"><g transform="translate(0 8)" data-feet="bottom">
<desc>Visitor owl avatar, accent layer: white ear-tuft tips, wing edge feathers and feet, aligned to the body layer. Tinted by the game. Original placeholder art for Owl Park.</desc>
<defs>
<clipPath id="tipClipL"><polygon points="20,0 101,0 26,62 20,62"/></clipPath>
<clipPath id="tipClipR"><polygon points="77,-2 180,-2 180,55"/></clipPath>
<clipPath id="featherClipL"><path d="M18,196 C30,186 46,182 60,186 C70,190 78,188 86,182 L86,232 L18,232 Z"/></clipPath>
<clipPath id="featherClipR"><path d="M180,198 C166,186 153,182 142,186 C133,190 127,188 122,182 L122,232 L180,232 Z"/></clipPath>
</defs>
<g fill="#FFFFFF">
  <!-- ear tuft tips: same tuft curves as the body layer, cut across the tuft so only the tips show -->
  <path d="M52,58 C50,42 48,26 44,12 C58,22 76,30 94,36 C78,42 62,50 52,58 Z" clip-path="url(#tipClipL)"/>
  <path d="M146,54 C148,40 149,26 149,14 C140,23 130,30 118,36 C127,42 137,47 146,54 Z" clip-path="url(#tipClipR)"/>
  <!-- wing edge feathers: same wing curves as the body layer, clipped to the scalloped tips -->
  <path d="M72,134 C50,134 28,158 28,186 L28,194 A10,10 0 0 0 43,206 A9.5,9.5 0 0 0 60,212 A10,10 0 0 0 76,200 C77,180 77,152 72,134 Z" clip-path="url(#featherClipL)"/>
  <path d="M136,134 C152,134 167,156 167,184 L167,192 A8.5,8.5 0 0 1 155,202 A7.5,7.5 0 0 1 142,207 A8.5,8.5 0 0 1 130,197 C128,180 128,152 136,134 Z" clip-path="url(#featherClipR)"/>
  <!-- feet: three stubby toes each, resting on y=232 -->
  <g id="footL">
    <path d="M68,222 A5,5 0 0 1 78,222 L78,227 A5,5 0 0 1 68,227 Z"/>
    <path d="M79,220 A5,5 0 0 1 89,220 L89,227 A5,5 0 0 1 79,227 Z"/>
    <path d="M90,222 A5,5 0 0 1 100,222 L100,227 A5,5 0 0 1 90,227 Z"/>
  </g>
  <g id="footR">
    <path d="M104,222 A5,5 0 0 1 114,222 L114,227 A5,5 0 0 1 104,227 Z"/>
    <path d="M115,220 A5,5 0 0 1 125,220 L125,227 A5,5 0 0 1 115,227 Z"/>
    <path d="M126,222 A5,5 0 0 1 136,222 L136,227 A5,5 0 0 1 126,227 Z"/>
  </g>
</g>
<!-- a touch of translucent-black shading so the toes separate from the body -->
<g fill="#000" fill-opacity="0.1">
  <rect x="68" y="216" width="32" height="6"/>
  <rect x="104" y="216" width="32" height="6"/>
</g>
</g></svg>
