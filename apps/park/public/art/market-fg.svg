<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<desc>Market foreground overlay: a chrome bollard with a lit ring and a trailing cable in the bottom-left corner; a crate stack, a closed umbrella and a second bollard with a cable at the bottom-right. Transparent elsewhere.</desc>
<defs>
<linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#5b6372"/>
  <stop offset="0.35" stop-color="#E9EDF3"/>
  <stop offset="0.55" stop-color="#C7CEDA"/>
  <stop offset="0.8" stop-color="#6d7584"/>
  <stop offset="1" stop-color="#aeb6c2"/>
</linearGradient>
<linearGradient id="chromeCap" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#F4F6FA"/>
  <stop offset="1" stop-color="#8d95a3"/>
</linearGradient>
<linearGradient id="crate" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#2a2a40"/>
  <stop offset="1" stop-color="#15151f"/>
</linearGradient>
<linearGradient id="brolly" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#8f1259"/>
  <stop offset="0.5" stop-color="#FF2AA1"/>
  <stop offset="1" stop-color="#7a0f4c"/>
</linearGradient>
<radialGradient id="ringGlow" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="#00E5FF" stop-opacity="0.6"/>
  <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
</radialGradient>
<filter id="glow4" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
<filter id="glow10" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10"/></filter>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>

<!-- ===== bottom-left: chrome bollard with cyan ring, and a cable snaking off the edge ===== -->
<g>
  <ellipse cx="140" cy="892" rx="120" ry="18" fill="#05050c" opacity="0.6" filter="url(#soft)"/>
  <!-- cable on the wet floor -->
  <path d="M160,874 C120,880 80,846 40,860 C10,870 -10,900 -20,900" fill="none" stroke="#0B0B16" stroke-width="12" stroke-linecap="round"/>
  <path d="M160,874 C120,880 80,846 40,860 C10,870 -10,900 -20,900" fill="none" stroke="#2f2f46" stroke-width="8" stroke-linecap="round"/>
  <path d="M160,874 C120,880 80,846 40,860 C10,870 -10,900 -20,900" fill="none" stroke="#5b6372" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 10"/>
  <!-- cyan glow on the floor from the ring -->
  <ellipse cx="128" cy="880" rx="90" ry="24" fill="url(#ringGlow)"/>
  <!-- bollard -->
  <ellipse cx="128" cy="884" rx="46" ry="14" fill="#2a2a3c"/>
  <path d="M86,884 C86,870 170,870 170,884 L166,900 L90,900 Z" fill="url(#chrome)"/>
  <path d="M96,872 L96,700 C96,684 160,684 160,700 L160,872 Z" fill="url(#chrome)"/>
  <ellipse cx="128" cy="700" rx="32" ry="12" fill="url(#chromeCap)"/>
  <path d="M100,698 C100,676 156,676 156,698" fill="none" stroke="#C7CEDA" stroke-width="3"/>
  <!-- lit ring -->
  <rect x="94" y="760" width="68" height="14" rx="4" fill="#00E5FF"/>
  <rect x="92" y="757" width="72" height="20" rx="5" fill="#00E5FF" opacity="0.55" filter="url(#glow4)"/>
  <rect x="104" y="763" width="48" height="6" rx="2" fill="#E6FDFF"/>
  <!-- magenta inlay stripe -->
  <rect x="100" y="800" width="56" height="4" rx="2" fill="#FF2AA1" opacity="0.9"/>
  <rect x="100" y="796" width="56" height="10" rx="3" fill="#FF2AA1" opacity="0.4" filter="url(#glow4)"/>
  <!-- rivets -->
  <g fill="#F4F6FA" opacity="0.85"><circle cx="108" cy="724" r="2.4"/><circle cx="148" cy="724" r="2.4"/><circle cx="108" cy="846" r="2.4"/><circle cx="148" cy="846" r="2.4"/></g>
  <!-- small traffic cone beside it -->
  <g transform="translate(222,870)">
    <ellipse cx="0" cy="26" rx="34" ry="8" fill="#05050c" opacity="0.5" filter="url(#soft)"/>
    <path d="M-14,24 L-5,-40 L5,-40 L14,24 Z" fill="#FF6A2A"/>
    <path d="M-10,-8 L10,-8 L12,6 L-12,6 Z" fill="#F6F1E3"/>
    <path d="M-12,14 L12,14 L13,22 L-13,22 Z" fill="#F6F1E3" opacity="0.6"/>
    <rect x="-24" y="22" width="48" height="8" rx="3" fill="#1b1b2c"/>
  </g>
</g>

<!-- ===== bottom-right: crate stack, closed umbrella, second bollard with cable ===== -->
<g>
  <ellipse cx="1470" cy="894" rx="170" ry="20" fill="#05050c" opacity="0.6" filter="url(#soft)"/>
  <!-- cable looping out to the right edge -->
  <path d="M1420,880 C1470,860 1520,890 1570,870 C1600,858 1620,880 1640,870" fill="none" stroke="#0B0B16" stroke-width="12" stroke-linecap="round"/>
  <path d="M1420,880 C1470,860 1520,890 1570,870 C1600,858 1620,880 1640,870" fill="none" stroke="#2f2f46" stroke-width="8" stroke-linecap="round"/>
  <path d="M1420,880 C1470,860 1520,890 1570,870 C1600,858 1620,880 1640,870" fill="none" stroke="#FF2AA1" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 12" opacity="0.8"/>
  <!-- crates -->
  <g transform="translate(1500,0)">
    <rect x="-70" y="800" width="120" height="90" rx="6" fill="url(#crate)" stroke="#3a3a52" stroke-width="2"/>
    <path d="M-62,808 L42,882 M42,808 L-62,882" stroke="#3a3a52" stroke-width="3"/>
    <rect x="-70" y="838" width="120" height="6" fill="#00E5FF" opacity="0.85"/>
    <rect x="-70" y="836" width="120" height="10" fill="#00E5FF" opacity="0.35" filter="url(#glow4)"/>
    <rect x="-54" y="720" width="96" height="82" rx="6" fill="url(#crate)" stroke="#3a3a52" stroke-width="2"/>
    <path d="M-46,728 L34,794 M34,728 L-46,794" stroke="#3a3a52" stroke-width="3"/>
    <rect x="-54" y="754" width="96" height="6" fill="#FF2AA1" opacity="0.85"/>
    <rect x="-54" y="752" width="96" height="10" fill="#FF2AA1" opacity="0.35" filter="url(#glow4)"/>
    <!-- abstract glyph label -->
    <g fill="none" stroke="#C7CEDA" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
      <circle cx="-20" cy="780" r="7"/><path d="M-6,774 L10,774 M-6,786 L4,786"/>
    </g>
  </g>
  <!-- closed umbrella leaning on the crates -->
  <g transform="translate(1418,890) rotate(-14)">
    <path d="M-12,0 L-22,-200 C-14,-230 14,-230 22,-200 L12,0 Z" fill="url(#brolly)"/>
    <path d="M-22,-200 C-14,-230 14,-230 22,-200" fill="none" stroke="#FF8ACB" stroke-width="2"/>
    <path d="M-10,-60 L10,-60 M-9,-100 L9,-100" stroke="#C7CEDA" stroke-width="3" stroke-linecap="round"/>
    <path d="M-13,-150 C-4,-146 4,-146 13,-150" fill="none" stroke="#C7CEDA" stroke-width="3" stroke-linecap="round"/>
    <rect x="-3" y="-250" width="6" height="26" rx="2" fill="url(#chrome)"/>
    <circle cx="0" cy="-252" r="6" fill="#C7CEDA"/>
    <rect x="-6" y="0" width="12" height="14" rx="3" fill="#5b6372"/>
  </g>
  <!-- bollard -->
  <ellipse cx="1584" cy="880" rx="90" ry="24" fill="url(#ringGlow)"/>
  <ellipse cx="1584" cy="884" rx="46" ry="14" fill="#2a2a3c"/>
  <path d="M1542,884 C1542,870 1626,870 1626,884 L1622,900 L1546,900 Z" fill="url(#chrome)"/>
  <path d="M1552,872 L1552,700 C1552,684 1616,684 1616,700 L1616,872 Z" fill="url(#chrome)"/>
  <ellipse cx="1584" cy="700" rx="32" ry="12" fill="url(#chromeCap)"/>
  <rect x="1550" y="760" width="68" height="14" rx="4" fill="#00E5FF"/>
  <rect x="1548" y="757" width="72" height="20" rx="5" fill="#00E5FF" opacity="0.55" filter="url(#glow4)"/>
  <rect x="1560" y="763" width="48" height="6" rx="2" fill="#E6FDFF"/>
  <rect x="1556" y="800" width="56" height="4" rx="2" fill="#FF2AA1" opacity="0.9"/>
  <g fill="#F4F6FA" opacity="0.85"><circle cx="1564" cy="724" r="2.4"/><circle cx="1604" cy="724" r="2.4"/><circle cx="1564" cy="846" r="2.4"/><circle cx="1604" cy="846" r="2.4"/></g>
  <!-- steam puff from a floor vent -->
  <g fill="#F6F1E3" filter="url(#glow10)">
    <ellipse cx="1330" cy="870" rx="40" ry="14" opacity="0.18"/>
    <ellipse cx="1346" cy="846" rx="34" ry="14" opacity="0.12"/>
  </g>
</g>
</svg>
