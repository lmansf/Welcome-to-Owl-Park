<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<desc>The street of nests, east screen: old trunks with round doors at their feet along a dusk lane, tree houses, rope bridges and lanterns; the lane leaves past a lantern post at the east end. Original placeholder art for Owl Park.</desc>
