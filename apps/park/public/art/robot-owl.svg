<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900">
<desc>The market's colossal robot owl: head and chest of a serene chrome-plated giant with plated ear tufts, hydraulic neck, a glowing cyan core and magenta lens eyes, its lower chest dissolving into haze. The figure fills the canvas (ear tufts near the top edge, plating almost edge to edge) so that, when the game scales it to fit below its anchor, it still towers over the skyline; no arms. Original placeholder art for Owl Park.</desc>
<defs>
<linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#F2F5F9"/>
  <stop offset="0.35" stop-color="#C7CEDA"/>
  <stop offset="0.7" stop-color="#6c7584"/>
  <stop offset="1" stop-color="#2a3140"/>
</linearGradient>
<linearGradient id="plateDark" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#8d95a3"/>
  <stop offset="0.5" stop-color="#3b4352"/>
  <stop offset="1" stop-color="#141a26"/>
</linearGradient>
<linearGradient id="plateV" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#E9EDF3"/>
  <stop offset="0.5" stop-color="#8d95a3"/>
  <stop offset="1" stop-color="#3b4352"/>
</linearGradient>
<linearGradient id="disc" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#1b2232"/>
  <stop offset="1" stop-color="#0C1E36"/>
</linearGradient>
<radialGradient id="eye" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="#FFFFFF"/>
  <stop offset="0.18" stop-color="#FFD6EE"/>
  <stop offset="0.45" stop-color="#FF2AA1"/>
  <stop offset="0.8" stop-color="#7a0f4c"/>
  <stop offset="1" stop-color="#2a0d22"/>
</radialGradient>
<radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="#FFFFFF"/>
  <stop offset="0.3" stop-color="#9FF4FF"/>
  <stop offset="0.7" stop-color="#00E5FF"/>
  <stop offset="1" stop-color="#005f6b"/>
</radialGradient>
<radialGradient id="hazeGlow" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="#FF2AA1" stop-opacity="0.3"/>
  <stop offset="0.55" stop-color="#6E3AFF" stop-opacity="0.1"/>
  <stop offset="0.9" stop-color="#6E3AFF" stop-opacity="0"/>
  <stop offset="1" stop-color="#6E3AFF" stop-opacity="0"/>
</radialGradient>
<linearGradient id="fadeV" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fff"/>
  <stop offset="0.8" stop-color="#fff"/>
  <stop offset="0.89" stop-color="#fff" stop-opacity="0.5"/>
  <stop offset="0.955" stop-color="#fff" stop-opacity="0.1"/>
  <stop offset="1" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<mask id="fade"><rect x="0" y="0" width="900" height="900" fill="url(#fadeV)"/></mask>
<filter id="glow6" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="glow14" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="glow26" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="26"/></filter>
</defs>

<!-- ambient haze behind the giant -->
<ellipse cx="450" cy="440" rx="450" ry="430" fill="url(#hazeGlow)"/>

<g mask="url(#fade)">
<g transform="translate(450,900) scale(1.36) translate(-450,-900)">
  <!-- ===== CHEST ===== -->
  <!-- shoulder / folded wing plates (no arms) -->
  <path d="M176,700 C150,760 142,840 150,900 L260,900 C250,840 250,760 262,690 Z" fill="url(#plateDark)"/>
  <path d="M724,700 C750,760 758,840 750,900 L640,900 C650,840 650,760 638,690 Z" fill="url(#plateDark)"/>
  <g fill="none" stroke="#C7CEDA" stroke-width="2" opacity="0.5">
    <path d="M170,760 C200,748 232,748 262,752 M160,820 C195,808 228,808 258,812"/>
    <path d="M730,760 C700,748 668,748 638,752 M740,820 C705,808 672,808 642,812"/>
  </g>
  <g fill="#FF2AA1">
    <rect x="176" y="782" width="76" height="5" rx="2" opacity="0.9"/><rect x="648" y="782" width="76" height="5" rx="2" opacity="0.9"/>
  </g>
  <g fill="#FF2AA1" opacity="0.5" filter="url(#glow6)">
    <rect x="176" y="779" width="76" height="11" rx="3"/><rect x="648" y="779" width="76" height="11" rx="3"/>
  </g>
  <!-- main chest hull -->
  <path d="M262,640 C230,700 222,800 232,900 L668,900 C678,800 670,700 638,640 C590,600 310,600 262,640 Z" fill="url(#plate)"/>
  <!-- chest breastplate (cream) -->
  <path d="M330,672 C300,730 296,820 306,900 L594,900 C604,820 600,730 570,672 C520,650 380,650 330,672 Z" fill="#F6F1E3"/>
  <path d="M330,672 C300,730 296,820 306,900 L594,900 C604,820 600,730 570,672 C520,650 380,650 330,672 Z" fill="url(#plateV)" opacity="0.35"/>
  <!-- breastplate feather-seam scallops -->
  <g fill="none" stroke="#8d95a3" stroke-width="2" opacity="0.7">
    <path d="M330,720 Q360,740 390,720 Q420,740 450,720 Q480,740 510,720 Q540,740 570,720"/>
    <path d="M318,776 Q352,796 386,776 Q420,796 454,776 Q488,796 522,776 Q556,796 586,776"/>
    <path d="M312,832 Q348,852 384,832 Q420,852 456,832 Q492,852 528,832 Q564,852 592,832"/>
  </g>
  <!-- chest core -->
  <circle cx="450" cy="760" r="78" fill="#00E5FF" opacity="0.45" filter="url(#glow26)"/>
  <circle cx="450" cy="760" r="58" fill="#0C1E36" stroke="#C7CEDA" stroke-width="6"/>
  <circle cx="450" cy="760" r="44" fill="none" stroke="#00E5FF" stroke-width="5"/>
  <circle cx="450" cy="760" r="30" fill="url(#core)"/>
  <circle cx="450" cy="760" r="30" fill="#00E5FF" opacity="0.6" filter="url(#glow14)"/>
  <g stroke="#C7CEDA" stroke-width="4" stroke-linecap="round"><path d="M450,700 L450,712 M450,808 L450,820 M390,760 L402,760 M498,760 L510,760"/></g>
  <!-- hull seams and rivets -->
  <g fill="none" stroke="#3b4352" stroke-width="2.5" opacity="0.8">
    <path d="M262,640 C300,660 360,668 450,668 C540,668 600,660 638,640"/>
    <path d="M232,860 L306,860 M594,860 L668,860 M240,790 L300,790 M600,790 L660,790"/>
  </g>
  <g fill="#F2F5F9"><circle cx="276" cy="700" r="4"/><circle cx="624" cy="700" r="4"/><circle cx="258" cy="760" r="4"/><circle cx="642" cy="760" r="4"/><circle cx="252" cy="830" r="4"/><circle cx="648" cy="830" r="4"/></g>
  <g fill="#FF2AA1" opacity="0.95"><circle cx="276" cy="700" r="1.6"/><circle cx="624" cy="700" r="1.6"/><circle cx="258" cy="760" r="1.6"/><circle cx="642" cy="760" r="1.6"/><circle cx="252" cy="830" r="1.6"/><circle cx="648" cy="830" r="1.6"/></g>

  <!-- ===== NECK: hydraulic column between head and chest ===== -->
  <rect x="362" y="520" width="176" height="130" rx="40" fill="url(#plateDark)"/>
  <rect x="384" y="520" width="132" height="130" rx="30" fill="#1b2232"/>
  <g>
    <rect x="372" y="540" width="24" height="100" rx="7" fill="url(#plateV)"/><rect x="378" y="500" width="12" height="60" rx="3" fill="#E9EDF3"/>
    <rect x="504" y="540" width="24" height="100" rx="7" fill="url(#plateV)"/><rect x="510" y="500" width="12" height="60" rx="3" fill="#E9EDF3"/>
    <rect x="438" y="548" width="24" height="92" rx="7" fill="url(#plateV)"/><rect x="444" y="508" width="12" height="60" rx="3" fill="#E9EDF3"/>
  </g>
  <g stroke="#00E5FF" stroke-width="3" stroke-linecap="round" opacity="0.9"><path d="M376,596 L392,596 M508,596 L524,596 M442,590 L458,590"/></g>
  <g fill="none" stroke="#FF2AA1" stroke-width="2.5" opacity="0.9"><path d="M404,560 C416,575 428,590 436,604 M496,560 C484,575 472,590 464,604"/></g>
  <!-- collar ring where the neck meets the chest -->
  <path d="M322,640 C322,618 578,618 578,640 L590,668 C520,650 380,650 310,668 Z" fill="url(#plateV)"/>
  <path d="M322,640 C322,618 578,618 578,640" fill="none" stroke="#F2F5F9" stroke-width="2"/>
  <g transform="translate(0,-62)">
  <!-- ===== HEAD ===== -->
  <!-- plated ear tufts -->
  <path d="M292,470 C270,420 262,370 268,322 C300,352 330,384 350,426 Z" fill="url(#plateDark)"/>
  <path d="M608,470 C630,420 638,370 632,322 C600,352 570,384 550,426 Z" fill="url(#plateDark)"/>
  <path d="M292,470 C270,420 262,370 268,322 C300,352 330,384 350,426 Z" fill="none" stroke="#00E5FF" stroke-width="2.5" opacity="0.9"/>
  <path d="M608,470 C630,420 638,370 632,322 C600,352 570,384 550,426 Z" fill="none" stroke="#FF2AA1" stroke-width="2.5" opacity="0.9"/>
  <path d="M292,470 C270,420 262,370 268,322 C300,352 330,384 350,426 Z" fill="none" stroke="#00E5FF" stroke-width="8" opacity="0.35" filter="url(#glow6)"/>
  <path d="M608,470 C630,420 638,370 632,322 C600,352 570,384 550,426 Z" fill="none" stroke="#FF2AA1" stroke-width="8" opacity="0.35" filter="url(#glow6)"/>
  <!-- cranium -->
  <path d="M450,380 C340,380 262,440 262,520 C262,600 340,640 450,640 C560,640 638,600 638,520 C638,440 560,380 450,380 Z" fill="url(#plate)"/>
  <!-- crown seam plates -->
  <path d="M450,380 C390,380 340,400 310,430 L450,418 L590,430 C560,400 510,380 450,380 Z" fill="url(#plateV)" opacity="0.8"/>
  <g fill="none" stroke="#3b4352" stroke-width="2.5" opacity="0.8"><path d="M310,430 C360,418 400,414 450,414 C500,414 540,418 590,430"/></g>
  <circle cx="450" cy="398" r="7" fill="#C7CEDA" stroke="#3b4352" stroke-width="2"/>
  <circle cx="450" cy="398" r="3" fill="#FF2AA1"/>
  <circle cx="450" cy="398" r="9" fill="#FF2AA1" opacity="0.5" filter="url(#glow6)"/>
  <!-- facial disc: two joined dark dishes with chrome rims -->
  <circle cx="358" cy="528" r="98" fill="url(#disc)" stroke="#C7CEDA" stroke-width="6"/>
  <circle cx="542" cy="528" r="98" fill="url(#disc)" stroke="#C7CEDA" stroke-width="6"/>
  <circle cx="358" cy="528" r="86" fill="none" stroke="#5b6372" stroke-width="2"/>
  <circle cx="542" cy="528" r="86" fill="none" stroke="#5b6372" stroke-width="2"/>
  <!-- radial disc plates (feather ribs) -->
  <g fill="none" stroke="#2a3140" stroke-width="2" opacity="0.9">
    <path d="M358,432 L358,450 M290,460 L303,473 M262,528 L280,528 M290,596 L303,583 M358,624 L358,606 M426,596 L413,583 M426,460 L413,473"/>
    <path d="M542,432 L542,450 M474,460 L487,473 M610,460 L597,473 M622,528 L604,528 M610,596 L597,583 M542,624 L542,606 M474,596 L487,583"/>
  </g>
  <!-- brow V plate -->
  <path d="M296,448 C340,420 400,418 450,470 C500,418 560,420 604,448 C560,436 500,440 450,496 C400,440 340,436 296,448 Z" fill="url(#plateV)"/>
  <path d="M296,448 C340,420 400,418 450,470 C500,418 560,420 604,448" fill="none" stroke="#F2F5F9" stroke-width="2"/>
  <!-- eyes: magenta lenses with cyan iris rings, serene half-lids -->
  <g filter="url(#glow26)" opacity="0.6"><circle cx="358" cy="528" r="70" fill="#FF2AA1"/><circle cx="542" cy="528" r="70" fill="#FF2AA1"/></g>
  <circle cx="358" cy="528" r="58" fill="url(#eye)"/>
  <circle cx="542" cy="528" r="58" fill="url(#eye)"/>
  <circle cx="358" cy="528" r="40" fill="none" stroke="#00E5FF" stroke-width="4" opacity="0.9"/>
  <circle cx="542" cy="528" r="40" fill="none" stroke="#00E5FF" stroke-width="4" opacity="0.9"/>
  <circle cx="358" cy="528" r="18" fill="#0B0B16"/>
  <circle cx="542" cy="528" r="18" fill="#0B0B16"/>
  <circle cx="368" cy="516" r="7" fill="#FFFFFF"/><circle cx="552" cy="516" r="7" fill="#FFFFFF"/>
  <circle cx="346" cy="542" r="3.5" fill="#FFFFFF" opacity="0.8"/><circle cx="530" cy="542" r="3.5" fill="#FFFFFF" opacity="0.8"/>
  <!-- upper lid plates: calm, half-closed -->
  <path d="M300,528 A58,58 0 0 1 416,528 L416,500 A58,58 0 0 0 300,500 Z" fill="url(#plateV)" opacity="0.97" transform="translate(0,-4)"/>
  <path d="M484,528 A58,58 0 0 1 600,528 L600,500 A58,58 0 0 0 484,500 Z" fill="url(#plateV)" opacity="0.97" transform="translate(0,-4)"/>
  <path d="M300,500 A58,58 0 0 1 416,500" fill="none" stroke="#2a3140" stroke-width="3" transform="translate(0,-4)"/>
  <path d="M484,500 A58,58 0 0 1 600,500" fill="none" stroke="#2a3140" stroke-width="3" transform="translate(0,-4)"/>
  <path d="M302,520 A58,58 0 0 1 414,520" fill="none" stroke="#C7CEDA" stroke-width="3" opacity="0.9"/>
  <path d="M486,520 A58,58 0 0 1 598,520" fill="none" stroke="#C7CEDA" stroke-width="3" opacity="0.9"/>
  <!-- beak: hooked chrome plate -->
  <path d="M424,560 C440,548 460,548 476,560 C470,600 460,626 450,648 C440,626 430,600 424,560 Z" fill="url(#plateV)" stroke="#2a3140" stroke-width="2.5"/>
  <path d="M434,566 C444,558 456,558 466,566" fill="none" stroke="#F2F5F9" stroke-width="2"/>
  <path d="M450,600 L450,640" stroke="#2a3140" stroke-width="2"/>
  <!-- cheek lights -->
  <g fill="#00E5FF"><circle cx="286" cy="600" r="4"/><circle cx="614" cy="600" r="4"/><circle cx="300" cy="620" r="3"/><circle cx="600" cy="620" r="3"/></g>
  <g fill="#00E5FF" opacity="0.5" filter="url(#glow6)"><circle cx="286" cy="600" r="8"/><circle cx="614" cy="600" r="8"/></g>
  </g>
</g>
</g>
</svg>
