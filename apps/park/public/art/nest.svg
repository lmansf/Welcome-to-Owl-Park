<desc>A nest: a cozy round room inside a tree trunk, with a round door on the left, a round dusk window in the middle, a hearth nook on the right, high shelves and a hanging lantern; bare wall beside the window and a bare floor for the furniture. Original placeholder art for Owl Park.</desc>
