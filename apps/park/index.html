<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // A page kept from an earlier deploy points at a script bundle that is gone: fetch the page
      // afresh, at most once a minute, instead of staying blank.
      addEventListener('error', function (e) {
        var t = e.target;
        if (!t || t.tagName !== 'SCRIPT' || !/\/assets\//.test(t.src || '')) return;
        try {
          var last = Number(sessionStorage.getItem('owl-park:refetched') || 0);
          if (Date.now() - last < 60000) return;
          sessionStorage.setItem('owl-park:refetched', String(Date.now()));
        } catch (_) {
          return;
        }
        var u = new URL(location.href);
        u.searchParams.set('fresh', String(Date.now()));
        location.replace(u.toString());
      }, true);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0C1E36" />
    <meta name="description" content="Owl Park: a virtual owl park you visit online. Wander the park as an owl, alongside everyone else who is here right now." />
    <title>Owl Park</title>
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Owl Park" />
    <meta property="og:title" content="Owl Park" />
    <meta property="og:description" content="A virtual owl park in the making. Wander the park as an owl, find hats, pets and sparkles, and meet everyone else who is here right now." />
    <meta property="og:image" content="__SITE_URL__%BASE_URL%og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Owl Park mascot, a great horned owl, beside the moonlit hollow inside the park's ancient tree." />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #0C1E36; overflow: hidden; overscroll-behavior: none; }
      body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #F6F1E3; -webkit-user-select: none; user-select: none; touch-action: none; }
      #game { position: fixed; inset: 0; }
      #game canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
